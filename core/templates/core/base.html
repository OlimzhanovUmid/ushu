{% load static i18n %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    {% block meta_add %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>

    <link rel="icon" href="{% static "img/logo.png" %}">
    <meta name="theme-color" content="#0b3d6b">

    <!-- Bootstrap Core CSS -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom theme (design tokens, palette, components) -->
    <link href="{% static "css/style.css" %}?v=2" rel="stylesheet">

    {% block css_assets_add %}{% endblock %}

</head>
<body>
{% block navigation %}{% endblock %}
<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- jQuery -->
<script src="{% static "js/jquery.js" %}"></script>
<!-- Bootstrap Core JavaScript -->
<script src="{% static "js/bootstrap.min.js" %}"></script>
<script src="{% static "js/jqBootstrapValidation.js" %}"></script>
<script src="{% static "js/bootstrap-table.js" %}"></script>
{% block js_assets_add %}{% endblock %}

</body>
</html>
