{% load static i18n %}

<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    {% block meta_add %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>

    <link rel="icon" href="{% static "img/logo.png" %}">
    <meta name="theme-color" content="#0b1f3a">

    <!-- Bootstrap Core CSS -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Typography: system font stack (offline LAN, no external font CDN) -->
    <!-- Custom theme (design tokens, palette, components) -->
    <link href="{% static "css/style.css" %}?v=3" rel="stylesheet">

    {% block css_assets_add %}{% endblock %}

</head>
<body class="app {% block body_class %}{% endblock %}">
{% block navigation %}{% endblock %}
<div class="container">
    {% block content %}{% endblock %}
</div>

<!-- jQuery -->
<script src="{% static "js/jquery.js" %}"></script>
<!-- Bootstrap Core JavaScript -->
<script src="{% static "js/bootstrap.min.js" %}"></script>
{% block js_assets_add %}{% endblock %}

</body>
</html>
