{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>O'zbekiston Ushu Federatsiyasi</title>

    <link rel="icon" href="{% static "img/logo.png" %}">
    <meta name="theme-color" content="#05396a">

    <!-- Bootstrap Core CSS -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom theme -->
    <link href="{% static "css/style.css" %}?v=2" rel="stylesheet">

</head>
<body class="login-page">
<div class="login-shell">

    <form class="form-signin" method="POST" action="?" autocomplete="off">
        {% csrf_token %}

        <div class="login-brand">
            <img class="logo" src="{% static "img/logo.png" %}" alt="O'zbekiston Ushu Federatsiyasi">
            <h1 class="login-title">O'zbekiston Ushu Federatsiyasi</h1>
            <p class="login-subtitle">{% trans "Judging system" %}</p>
        </div>

        <h2 class="form-signin-heading">{% trans "Log in" %}</h2>

        {% if form.non_field_errors %}
            {% for error in form.non_field_errors %}
                <div class="alert alert-danger" role="alert">
                    <span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"></span>
                    <span class="sr-only">{% trans "Error:" %}</span>
                    {{ error }}
                </div>
            {% endfor %}
        {% endif %}

        <label for="inputEmail" class="sr-only">{% trans "Username" %}</label>
        <input autocomplete="off" name="username" required="required" id="inputEmail" class="form-control"
               placeholder="{% trans "Username" %}" autofocus>

        <label for="inputPassword" class="sr-only">{% trans "Password" %}</label>
        <input autocomplete="off" name="password" type="password" id="inputPassword" class="form-control"
               placeholder="Пароль" required>

        <button class="btn btn-lg btn-block btn-login" type="submit">{% trans "Log in" %}</button>
    </form>

</div> <!-- /login-shell -->

<!-- jQuery -->
<script src="{% static "js/jquery.js" %}"></script>

<!-- Bootstrap Core JavaScript -->
<script src="{% static "js/bootstrap.min.js" %}"></script>

<script src="{% static "js/jqBootstrapValidation.js" %}"></script>
</body>
</html>
