{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Bootstrap Core CSS -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Typography: system font stack (offline LAN, no external font CDN) -->
    <!-- Custom theme -->
    <link href="{% static "css/style.css" %}?v=3" rel="stylesheet">

    <style type="text/css">
        .vertical-center {
            min-height: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .horizontal-center {
            min-width: 100%;
            min-width: 100vh;
            display: flex;
            align-items: center;
        }

        .center {
            margin-left: auto;
            margin-right: auto;
        }
    </style>

</head>
<body class="monitor-screen">
<div id="replacable">
    <div id="idle-screen">
        <br><br><br>
        <h1 class="text-center" style="font-size:5em;">{{ event_title }}</h1>
        <br>
        <p class="text-center" style="font-size:4em;">{{ event_subtitle }}</p>
        <br>
        <p><img class="text-center" style="margin-left:40%;" width="300" height="300"
                src="{% static "img/logo.png" %}"/></p>
        <br>
        <br>
        <p class="text-center" style="margin-left:40px;font-size:4em;"></p>
    </div>
</div>

<!-- jQuery -->
<script src="{% static "js/jquery.js" %}"></script>
<!-- Bootstrap Core JavaScript -->
<script src="{% static "js/bootstrap.min.js" %}"></script>

<script type="text/javascript">
    // Server-Sent Events: the server pushes the current monitor snapshot; no
    // polling and no retry storm (EventSource reconnects on the server's
    // `retry:` interval). Multi-page snapshots cycle every 5s.
    var idleHtml = document.getElementById('replacable').innerHTML;
    var pages = [];
    var cycleTimer = null;

    function showPage(idx) {
        if (!pages.length) return;
        idx = idx % pages.length;
        $('#replacable').html(pages[idx]);
        try { myFunc(); } catch (err) {}
        if (pages.length > 1) {
            cycleTimer = setTimeout(function () { showPage(idx + 1); }, 5000);
        }
    }

    function applySnapshot(newPages) {
        if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }
        pages = newPages || [];
        if (pages.length) {
            showPage(0);
        } else {
            $('#replacable').html(idleHtml);
        }
    }

    var source = new EventSource('{% url "monitor_stream" %}');
    source.addEventListener('snapshot', function (event) {
        try {
            applySnapshot(JSON.parse(event.data).pages);
        } catch (err) {}
    });
</script>

</body>
</html>
