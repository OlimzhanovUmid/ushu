{% load static i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">

    <!-- Bootstrap Core CSS -->
    <link href="{% static "css/bootstrap.min.css" %}" rel="stylesheet">
    <!-- Typography: system font stack (offline LAN, no external font CDN) -->
    <!-- Custom theme (foundation tokens + .screen-monitor rules live here) -->
    <link href="{% static "css/style.css" %}?v=3" rel="stylesheet">

</head>
<body class="monitor-screen screen-monitor">
<div id="replacable">
    <div id="idle-screen" class="mon-idle">
        <div class="mon-idle__frame">
            <img class="mon-idle__crest" src="{% static "img/logo.png" %}"
                 alt="{{ event_title }}" width="300" height="300">
            <h1 class="mon-idle__title">{{ event_title }}</h1>
            <span class="mon-idle__rule" aria-hidden="true"></span>
            <p class="mon-idle__subtitle">{{ event_subtitle }}</p>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="{% static "js/jquery.js" %}"></script>
<!-- Bootstrap Core JavaScript -->
<script src="{% static "js/bootstrap.min.js" %}"></script>

<script type="text/javascript">
    // Server-Sent Events: the server pushes the current monitor snapshot; no
    // polling and no retry storm (EventSource reconnects on the server's
    // `retry:` interval). Multi-page snapshots cycle every 5s.
    var idleHtml = document.getElementById('replacable').innerHTML;
    var pages = [];
    var cycleTimer = null;

    function showPage(idx) {
        if (!pages.length) return;
        idx = idx % pages.length;
        $('#replacable').html(pages[idx]);
        try { myFunc(); } catch (err) {}
        if (pages.length > 1) {
            cycleTimer = setTimeout(function () { showPage(idx + 1); }, 5000);
        }
    }

    function applySnapshot(newPages) {
        if (cycleTimer) { clearTimeout(cycleTimer); cycleTimer = null; }
        pages = newPages || [];
        if (pages.length) {
            showPage(0);
        } else {
            $('#replacable').html(idleHtml);
        }
    }

    var source = new EventSource('{% url "monitor_stream" %}');
    source.addEventListener('snapshot', function (event) {
        try {
            applySnapshot(JSON.parse(event.data).pages);
        } catch (err) {}
    });
</script>

</body>
</html>
